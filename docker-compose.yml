services:
  paperpulse:
    build: .
    image: paperpulse:local
    container_name: paperpulse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # 只监听回环；对外请用 Caddy / Nginx 反代并配 HTTPS
    environment:
      # 必填：用 python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())" 生成
      PAPERPULSE_SECRET_KEY: "${PAPERPULSE_SECRET_KEY:?请在 .env 中设置}"
      PAPERPULSE_ENCRYPTION_KEY: "${PAPERPULSE_ENCRYPTION_KEY:?请在 .env 中设置}"
    volumes:
      - paperpulse-data:/app/data
      - ./config:/app/config
    # 1C1G 目标：与 systemd 部署保持一致的上限
    mem_limit: 700m
    cpus: 0.8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  paperpulse-data:
