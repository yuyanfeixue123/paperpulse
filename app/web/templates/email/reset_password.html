<body style="font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f7f8fa;padding:20px;color:#1a1d21">
<div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:20px">
  <h1 style="font-size:17px">重置你的密码</h1>

  <p style="background:#f6f6f4;border-left:3px solid #ccc;padding:12px;font-size:13px">
