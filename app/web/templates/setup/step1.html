{% extends "layouts/base.html" %}
{% block title %}首次部署 · 第 1 步{% endblock %}
{% block content %}
<div class="container narrow">
  <div class="steps">
    {% for i in range(1, total + 1) %}
      <span class="step {% if i == step %}active{% elif i < step %}done{% endif %}">{{ i }} {{ titles[i] }}</span>
    {% endfor %}
  </div>
  <div class="card">
    <h1>1 · 创建管理员账号</h1>
    <form method="post" action="/admin/setup/1">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field">
        <label>管理员邮箱</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" name="password" required>
        <p class="small muted">至少 10 位，含大小写字母与数字</p>
      </div>
      <div class="field">
        <label>时区</label>
        <input type="text" name="timezone" value="Asia/Shanghai">
      </div>
      <button type="submit">下一步</button>
    </form>
  </div>
</div>
{% endblock %}
