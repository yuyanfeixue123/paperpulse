# PaperPulse 内置数据源清单
# 字段：key / name / type / field / url_template / params / requires_key / rate_limit / enabled
# type 取值：arxiv | openalex | crossref | doaj | europepmc | biorxiv | osf | rss
# 默认开启的源必须全部 requires_key: false
# 源链接核实日期：2026-10-03

sources:
  # ---------- 综合 / 全领域 API ----------
  - key: arxiv
    name: arXiv（默认分类）
    type: arxiv
    field: cs
    url_template: https://export.arxiv.org/api/query
    params: { categories: [cs.AI, cs.CV, cs.LG, cs.CL] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: true

  - key: arxiv_econ
    name: arXiv 经济
    type: arxiv
    field: economics
    url_template: https://export.arxiv.org/api/query
    params: { categories: [econ.GN, econ.EM] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_qfin
    name: arXiv 金融
    type: arxiv
    field: finance
    url_template: https://export.arxiv.org/api/query
    params: { categories: [q-fin.GN, q-fin.RM] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_stat
    name: arXiv 统计
    type: arxiv
    field: statistics
    url_template: https://export.arxiv.org/api/query
    params: { categories: [stat.ME, stat.AP] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_eess
    name: arXiv 电子与系统工程
