# PaperPulse 内置数据源清单
# 字段：key / name / type / field / url_template / params / requires_key / rate_limit / enabled
# type 取值：arxiv | openalex | crossref | doaj | europepmc | biorxiv | osf | rss
# 默认开启的源必须全部 requires_key: false
# 源链接核实日期：2026-10-03

sources:
  # ---------- 综合 / 全领域 API ----------
  - key: arxiv
    name: arXiv（默认分类）
    type: arxiv
    field: cs
    url_template: https://export.arxiv.org/api/query
    params: { categories: [cs.AI, cs.CV, cs.LG, cs.CL] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: true

  - key: arxiv_econ
    name: arXiv 经济
    type: arxiv
    field: economics
    url_template: https://export.arxiv.org/api/query
    params: { categories: [econ.GN, econ.EM] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_qfin
    name: arXiv 金融
    type: arxiv
    field: finance
    url_template: https://export.arxiv.org/api/query
    params: { categories: [q-fin.GN, q-fin.RM] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_stat
    name: arXiv 统计
    type: arxiv
    field: statistics
    url_template: https://export.arxiv.org/api/query
    params: { categories: [stat.ME, stat.AP] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_eess
    name: arXiv 电子与系统工程
    type: arxiv
    field: engineering
    url_template: https://export.arxiv.org/api/query
    params: { categories: [eess.SP, eess.SY] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_qbio
    name: arXiv 定量生物学
    type: arxiv
    field: biology
    url_template: https://export.arxiv.org/api/query
    params: { categories: [q-bio.NC, q-bio.QM] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_physics
    name: arXiv 物理
    type: arxiv
    field: physics
    url_template: https://export.arxiv.org/api/query
    params: { categories: [physics.soc-ph, physics.app-ph] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: arxiv_math
    name: arXiv 数学
    type: arxiv
    field: mathematics
    url_template: https://export.arxiv.org/api/query
    params: { categories: [math.OC, math.ST] }
    requires_key: false
    rate_limit: { interval_seconds: 3, concurrency: 1 }
    enabled: false

  - key: openalex
    name: OpenAlex
    type: openalex
    field: multidisciplinary
    url_template: https://api.openalex.org/works
    params: { query: "" }
    requires_key: false
    rate_limit: { interval_seconds: 0.5, concurrency: 2 }
    enabled: true

  - key: crossref
    name: Crossref（DOI/摘要补全）
    type: crossref
    field: multidisciplinary
    url_template: https://api.crossref.org/works
    params: {}
    requires_key: false
    rate_limit: { interval_seconds: 0.5, concurrency: 2 }
    enabled: true

  - key: hf_papers
    name: HuggingFace Daily Papers（社区高赞）
    type: hf_papers
    field: ai
    # 注意端点是 /api/daily_papers —— /api/papers/daily 不存在
    url_template: https://huggingface.co/api/daily_papers
    params: { page_size: 50 }
    requires_key: false
    rate_limit: { interval_seconds: 1.0, concurrency: 1 }
    # 默认关闭：只覆盖 AI 垂类、以 arXiv 预印本为主，按需启用。
    # 开启后可为 AI 用户补充两个别处拿不到的信号：
    #   githubRepo —— 作者自填的代码仓库（准确率远高于按标题盲搜）
    #   ai_keywords —— 社区侧关键词，补上关键词模式无 LLM 时的短板
    enabled: false

  - key: doaj
    name: DOAJ 开放获取期刊
    type: doaj
    field: multidisciplinary
    url_template: https://doaj.org/api/search/articles
    params: { query: "" }
    requires_key: false
    rate_limit: { interval_seconds: 0.5, concurrency: 2 }
    enabled: true

