name: 功能建议
description: 提出新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你实际遇到的问题，而不是解决方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 采集 / 数据源
        - 兴趣解析与画像
        - 筛选与排序
        - 邮件投递
        - 存储与清理
        - 部署与守护
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该改动不需要新增常驻依赖（保持 1C1G 可运行）
        - label: 该改动不要求终端用户注册任何第三方服务
